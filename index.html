<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💪 FitBuddy AI</h1>

    <p class="subtitle">
        AI Fitness Plan Generator using Gemini
    </p>

    <form id="fitnessForm">

        <label>Age</label>
        <input type="number" id="age" required>

        <label>Fitness Goal</label>
        <select id="goal" required>
            <option value="">Select goal</option>
            <option value="general fitness">General Fitness</option>
            <option value="strength">Strength</option>
            <option value="flexibility">Flexibility</option>
            <option value="better stamina">Better Stamina</option>
            <option value="healthy lifestyle">Healthy Lifestyle</option>
        </select>

        <label>Activity Level</label>
        <select id="activity">
            <option value="beginner">Beginner</option>
            <option value="lightly active">Lightly Active</option>
            <option value="moderately active">Moderately Active</option>
        </select>

        <label>Days Per Week</label>
        <select id="days">
            <option value="3">3 Days</option>
            <option value="4">4 Days</option>
            <option value="5">5 Days</option>
        </select>

        <label>Preferences</label>
        <textarea
            id="preferences"
            placeholder="Example: walking, yoga, home workout..."
        ></textarea>

        <button type="submit">
            Generate My Plan
        </button>

    </form>

    <div id="result">
        Your AI-generated plan will appear here.
    </div>

</div>

<script>

document.getElementById("fitnessForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const result = document.getElementById("result");

    result.innerHTML = "⏳ Generating your plan...";

    const data = {
        age: document.getElementById("age").value,
        goal: document.getElementById("goal").value,
        activity: document.getElementById("activity").value,
        days: document.getElementById("days").value,
        preferences: document.getElementById("preferences").value
    };

    try {

        const response = await fetch("/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const resultData = await response.json();

        if (resultData.error) {
            result.innerHTML = "❌ Error: " + resultData.error;
        } else {
            result.innerHTML = resultData.plan;
        }

    } catch (error) {

        result.innerHTML =
            "❌ Something went wrong. Please check the terminal.";

    }

});

</script>

</body>
</html>
